[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anomalykit"
version = "0.1.0"
description = "Industrial Anomaly Detection & Predictive Analytics Library"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "pandas>=2.0",
]

[project.optional-dependencies]
forecast = ["prophet>=1.1"]
examples = ["matplotlib>=3.7", "jupyter>=1.0", "seaborn>=0.12"]
dev = ["pytest>=7.0", "pytest-cov"]

[tool.setuptools.packages.find]
where = ["src"]

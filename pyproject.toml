[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anomalykit"
version = "0.1.0"
description = "Industrial Anomaly Detection & Predictive Analytics Library"
requires-python = ">=3.10"
license = {text = "MIT"}
readme = "README.md"
authors = [{name = "itiana"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "pandas>=2.0",
]

[project.optional-dependencies]
forecast = ["prophet>=1.1"]
examples = ["matplotlib>=3.7", "jupyter>=1.0", "seaborn>=0.12"]
dev = ["pytest>=7.0", "pytest-cov", "ruff>=0.4", "mypy>=1.10"]

[project.urls]
Repository = "https://github.com/itiana/anomalykit"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["numpy.*", "scipy.*", "sklearn.*", "pandas.*", "prophet.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
